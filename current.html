<style>
:root {
  --primary:#2D5F4E; --dark:#1A3D2E; --medium:#5B8C7A; --light:#D5E0DB;

  --done:#27AE60; --progress:#F1C40F; --todo:#E74C3C; --overdue:#8B0000;

  --shadow:0 2px 8px rgba(0,0,0,0.08); --shadow-hover:0 4px 16px rgba(0,0,0,0.12);

}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}

.top-bar{background:var(--primary);color:var(--white);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15);flex-wrap:wrap}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav-links{display:flex;gap:8px}
.nav-link{color:rgba(255,255,255,0.8);text-decoration:none;font-size:13px;padding:5px 14px;border-radius:6px;transition:all 0.2s}
.nav-link:hover{background:rgba(255,255,255,0.15);color:white}
.nav-link.active{background:rgba(255,255,255,0.2);color:white}

/* 趋势图区 */
.trend-section{padding:16px 24px;max-width:1600px;margin:0 auto}
.trend-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.trend-chart{background:var(--white);border-radius:10px;box-shadow:var(--shadow);padding:20px;overflow-x:auto}
.trend-bars{display:flex;gap:12px;align-items:flex-end;min-height:160px;min-width:500px}
.trend-bar-group{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:50px}
.trend-bar{width:100%;max-width:40px;border-radius:6px 6px 0 0;transition:height 0.3s ease;position:relative;min-height:4px}
.trend-bar.progress{background:linear-gradient(180deg,#F1C40F,#D4AC0D)}
.trend-bar.done{background:linear-gradient(180deg,var(--done),#1E8449)}
.trend-bar.overdue{background:linear-gradient(180deg,var(--overdue),#6B0000)}
.trend-bar.empty{background:var(--light)}
.trend-bar .bar-num{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#666}
.trend-bar-label{font-size:11px;color:#999;font-weight:600;white-space:nowrap}
.trend-bar-date{font-size:10px;color:#ccc}
.trend-summary{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.trend-summary-item{background:var(--lighter);border-radius:8px;padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:6px}
.trend-summary-item .ts-icon{font-size:16px}
.trend-summary-item .ts-val{font-weight:700;color:var(--primary)}

/* 搜索+筛选栏 */
.filter-bar{background:var(--white);padding:10px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--light);flex-wrap:wrap}
.search-box{padding:6px 12px;border:2px solid var(--light);border-radius:20px;font-size:13px;width:200px;transition:all 0.2s;outline:none}
.search-box:focus{border-color:var(--medium);width:260px}
.filter-btn{padding:5px 14px;border:2px solid var(--light);background:var(--white);border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;color:#666;transition:all 0.2s}
.filter-btn:hover{border-color:var(--medium)}
.filter-btn.active{background:var(--primary);border-color:var(--primary);color:var(--white)}
.filter-btn .count{font-size:11px;opacity:0.7;margin-left:4px}
.week-display{font-size:14px;font-weight:700;color:var(--primary)}
.section-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title .badge{background:var(--medium);color:white;font-size:12px;padding:1px 8px;border-radius:10px}

/* 看板 */
.board-section{padding:16px 24px;max-width:1600px;margin:0 auto}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.store-card{background:var(--white);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;transition:all 0.2s ease;cursor:pointer;border-left:4px solid var(--medium)}
.store-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.store-card.group-A{border-left-color:var(--col-A)} .store-card.group-B{border-left-color:var(--col-B)}
.store-card.group-C{border-left-color:var(--col-C)} .store-card.group-D{border-left-color:var(--col-D)}
.store-card.no-task{opacity:0.55} .store-card.no-task:hover{opacity:1}

.card-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:var(--lighter)}
.card-header .store-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.card-header .streak-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;background:var(--primary);color:white}
.group-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;color:var(--white)}
.group-tag.g-A{background:var(--col-A)} .group-tag.g-B{background:var(--col-B)}
.group-tag.g-C{background:var(--col-C)} .group-tag.g-D{background:var(--col-D)}

.card-status-bar{padding:6px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--lighter)}
.status-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.status-badge.done{background:var(--done);color:white}
.status-badge.progress{background:var(--progress);color:#666}
.status-badge.overdue{background:var(--overdue);color:white}
.type-badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.type-badge.short{background:var(--short);color:white}
.type-badge.long{background:var(--long);color:white}
.card-week{font-size:12px;color:#999;margin-left:auto}

.card-body{padding:10px 14px}
.card-body .label{font-size:11px;color:#999;font-weight:600;margin-bottom:2px}
.card-body .content{font-size:13px;margin-bottom:8px;line-height:1.5}
.card-body .content:last-child{margin-bottom:0}
.store-card.no-task .card-body{padding:8px 14px}
.store-card.no-task .card-body .content{color:#999;font-style:italic;margin-bottom:0}

.card-expand{max-height:0;overflow:hidden;transition:max-height 0.3s ease;border-top:1px solid var(--lighter)}
.store-card.expanded .card-expand{max-height:600px}
.card-expand-content{padding:10px 14px}
.expand-row{display:flex;gap:8px;margin-bottom:6px;font-size:12px}
.expand-row .e-label{color:#999;min-width:70px;flex-shrink:0}
.expand-row .e-val{color:var(--text);flex:1}

.progress-bar-wrap{padding:6px 14px;background:var(--lighter)}
.progress-bar{height:5px;background:var(--light);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 0.3s ease}
.progress-fill.done{background:var(--done);width:100%}
.progress-fill.progress{background:var(--progress);width:50%}
.progress-fill.overdue{background:var(--overdue);width:100%}
.progress-fill.none{background:#ccc;width:0%}
.progress-text{font-size:11px;color:#999;margin-top:3px}

.section-divider{margin:20px 0 12px;display:flex;align-items:center;gap:12px}
.section-divider .line{flex:1;height:1px;background:var(--light)}
.section-divider .toggle-btn{padding:4px 12px;border:1px solid var(--light);background:var(--white);border-radius:16px;cursor:pointer;font-size:12px;color:#666;transition:all 0.2s}
.section-divider .toggle-btn:hover{border-color:var(--medium);color:var(--primary)}
.no-task-board{display:none;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.no-task-board.show{display:grid}
.empty-state{grid-column:1/-1;text-align:center;padding:40px 20px;color:#999}

@media (max-width:768px){

  .filter-bar{padding:8px 12px}
  .top-bar{padding:0 12px;height:auto;min-height:56px;padding-top:8px;padding-bottom:8px}
  .nav-links{display:none}
  .search-box{width:140px} .search-box:focus{width:180px}
  .trend-section{padding:12px}
  .trend-bars{min-width:300px}
}
</style>

// ====== 渲染趋势图 ======
function renderTrend() {
  // 近4周数据模拟（W26~W29），后续真实更新
  const trendData = [
    {week:"W26", date:"6月第四周", progress:0, done:0, overdue:0},
    {week:"W27", date:"7月第一周", progress:0, done:0, overdue:0},
    {week:"W28", date:"7月第二周", progress:2, done:0, overdue:0},
    {week:"W29", date:"7月第三周", progress:7, done:0, overdue:0},
  ];
  const maxVal = Math.max(...trendData.map(d=>d.progress+d.done+d.overdue), 1);
  const barH = 120;

  const barsHtml = trendData.map(d => {
    const total = d.progress + d.done + d.overdue;
    const isCurrent = d.week === "W29";
    const pH = d.progress ? Math.round(d.progress/maxVal*barH) : 0;
    const dH = d.done ? Math.round(d.done/maxVal*barH) : 0;
    const oH = d.overdue ? Math.round(d.overdue/maxVal*barH) : 0;
    return `<div class="trend-bar-group">
      <div class="trend-bar ${total>0?'progress':'empty'}" style="height:${pH+dH+oH||4}px;${isCurrent?'box-shadow:0 0 0 2px var(--primary);':''}">
        ${total>0?`<span class="bar-num">${total}</span>`:''}
      </div>
      <span class="trend-bar-label" style="${isCurrent?'color:var(--primary);font-weight:700;':''}">${d.week}</span>
      <span class="trend-bar-date">${d.date}</span>
    </div>`;
  }).join('');
  document.getElementById('trendBars').innerHTML = barsHtml;

  // 汇总
  const totalTasks = Object.keys(tasks).length;
  const maxStreak = Math.max(...Object.values(streakData));
  const longTasks = Object.values(tasks).filter(t=>t.type==='long').length;
  const shortTasks = totalTasks - longTasks;
  document.getElementById('trendSummary').innerHTML = `
    <div class="trend-summary-item"><span class="ts-icon">📌</span> 本周任务 <span class="ts-val">${totalTasks}</span></div>
    <div class="trend-summary-item"><span class="ts-icon">🔥</span> 最长连续跟进 <span class="ts-val">${maxStreak}周</span></div>
    <div class="trend-summary-item"><span class="ts-icon">🔄</span> 长期任务 <span class="ts-val">${longTasks}</span></div>
    <div class="trend-summary-item"><span class="ts-icon">⚡</span> 短期任务 <span class="ts-val">${shortTasks}</span></div>
  `;
}

// ====== 渲染看板 ======
function render() {
  let filtered;
  if (searchTerm) {
    filtered = stores.filter(s => s.name.includes(searchTerm));
  } else if (currentView === 'focus') {
    filtered = stores.filter(s => focusStores.includes(s.name));
  } else if (currentView === 'all') {
    filtered = stores;
  } else {
    filtered = stores.filter(s => s.group === currentView);
  }

  const withTask = filtered.filter(s => tasks[s.name]);
  const withoutTask = filtered.filter(s => !tasks[s.name]);

  document.getElementById('taskCount').textContent = withTask.length;
  document.getElementById('noTaskCount').textContent = withoutTask.length;

  const board = document.getElementById('board');
  if (withTask.length === 0) {
    board.innerHTML = '<div class="empty-state"><div style="font-size:36px;">🔍</div><p>未找到匹配的门店</p></div>';
  } else {
    board.innerHTML = withTask.map(s => renderTaskCard(s)).join('');
  }

  const noBoard = document.getElementById('noTaskBoard');
  noBoard.innerHTML = withoutTask.map(s => renderNoTaskCard(s)).join('');
}

function renderTaskCard(s) {
  const t = tasks[s.name];
  const status = statusMap[t.status];
  const type = typeMap[t.type];
  const streak = streakData[s.name] || 0;
  return `
  <div class="store-card group-${s.group}" onclick="toggleExpand(this)" data-store="${s.name}">
    <div class="card-header">
      <span class="store-name">${s.name}</span>
      <div style="display:flex;gap:6px;align-items:center;">
        ${streak>1?`<span class="streak-badge">🔥连续${streak}周</span>`:''}
        <span class="group-tag g-${s.group}">${s.group}组</span>
      </div>
    </div>
    <div class="card-status-bar">
      <span class="status-badge ${status.class}">${status.label}</span>
      <span class="type-badge ${type.class}">${type.label}</span>
      <span class="card-week">${t.week}</span>
    </div>
    <div class="card-body">
      <div class="label">数据摘要</div>
      <div class="content">${t.summary}</div>
      <div class="label">本周重点</div>
      <div class="content">${t.focus}</div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar"><div class="progress-fill ${status.class}"></div></div>
      <div class="progress-text">${status.label} · ${status.progress}%</div>
    </div>
    <div class="card-expand">
      <div class="card-expand-content">
        <div class="expand-row"><span class="e-label">执行指令</span><span class="e-val">${(t.actions||'').replace(/\n/g,'<br>')}</span></div>
        <div class="expand-row"><span class="e-label">责任人</span><span class="e-val">${t.owner}</span></div>
        <div class="expand-row"><span class="e-label">计划完成</span><span class="e-val">${t.deadline}</span></div>
        <div class="expand-row"><span class="e-label">实际完成</span><span class="e-val">${t.completed||'—'}</span></div>
        <div class="expand-row"><span class="e-label">备注</span><span class="e-val">${t.note||'—'}</span></div>
      </div>
    </div>
  </div>`;
}

function renderNoTaskCard(s) {
  return `
  <div class="store-card no-task group-${s.group}" onclick="toggleExpand(this)">
    <div class="card-header">
      <span class="store-name">${s.name}</span>
      <span class="group-tag g-${s.group}">${s.group}组</span>
    </div>
    <div class="card-body"><div class="content">暂无重点任务</div></div>
  </div>`;
}

function toggleExpand(card){card.classList.toggle('expanded')}
function toggleNoTask(){noTaskExpanded=!noTaskExpanded;document.getElementById('noTaskBoard').classList.toggle('show',noTaskExpanded);document.getElementById('toggleBtn').textContent=noTaskExpanded?'收起 ▲':'展开 ▼'}
function filterView(view){currentView=view;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));event.target.closest('.filter-btn').classList.add('active');noTaskExpanded=false;document.getElementById('noTaskBoard').classList.remove('show');document.getElementById('toggleBtn').textContent='展开 ▼';render()}
function handleSearch(){searchTerm=document.getElementById('searchBox').value.trim();render()}

renderTrend();
render();
</script>
</body>
</html>
