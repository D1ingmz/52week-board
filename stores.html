<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光线科技 · 全门店一览</title>
<style>
:root {
  --primary:#2D5F4E; --dark:#1A3D2E; --medium:#5B8C7A; --light:#D5E0DB;
  --lighter:#E8F0ED; --white:#fff; --text:#333; --bg:#F5F7F6;
  --done:#27AE60; --progress:#F1C40F; --todo:#E74C3C; --overdue:#8B0000;
  --shadow:0 2px 8px rgba(0,0,0,0.08); --shadow-hover:0 4px 16px rgba(0,0,0,0.12);
  --col-A:#3498db; --col-B:#2ecc71; --col-C:#e67e22; --col-D:#9b59b6;
  /* 板块色 */
  --ops:#2D5F4E; --training:#2C6FAB; --academy:#8E44AD; --office:#D4A017;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}

.top-bar{background:var(--primary);color:var(--white);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav-links{display:flex;gap:8px}
.nav-link{color:rgba(255,255,255,0.8);text-decoration:none;font-size:13px;padding:5px 14px;border-radius:6px;transition:all 0.2s}
.nav-link:hover{background:rgba(255,255,255,0.15);color:white}
.nav-link.active{background:rgba(255,255,255,0.2);color:white}

/* 板块Tab栏 */
.board-tabs{display:flex;background:var(--white);border-bottom:2px solid var(--lighter);padding:0 24px;position:sticky;top:56px;z-index:99;overflow-x:auto}
.board-tab{padding:10px 20px;font-size:14px;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.board-tab:hover{color:var(--dark);background:var(--lighter)}
.board-tab.active{font-weight:700}
.board-tab.active[data-board="ops"]{color:var(--ops);border-bottom-color:var(--ops)}
.board-tab.active[data-board="training"]{color:var(--training);border-bottom-color:var(--training)}
.board-tab.active[data-board="academy"]{color:var(--academy);border-bottom-color:var(--academy)}
.board-tab.active[data-board="office"]{color:var(--office);border-bottom-color:var(--office)}

.filter-bar{background:var(--white);padding:10px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--light);flex-wrap:wrap;position:sticky;top:112px;z-index:50}
.search-box{padding:6px 12px;border:2px solid var(--light);border-radius:20px;font-size:13px;width:200px;transition:all 0.2s;outline:none}
.search-box:focus{border-color:var(--medium);width:260px}
.filter-btn{padding:5px 14px;border:2px solid var(--light);background:var(--white);border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;color:#666;transition:all 0.2s}
.filter-btn:hover{border-color:var(--medium)}
.filter-btn.active{background:var(--primary);border-color:var(--primary);color:var(--white)}
.filter-btn .count{font-size:11px;opacity:0.7;margin-left:4px}
.week-display{font-size:14px;font-weight:700;color:var(--primary)}

/* 表格 */
.table-wrap{padding:16px 24px;max-width:1600px;margin:0 auto;overflow-x:auto}
.stores-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--white);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);min-width:800px}
.stores-table thead{background:var(--primary);color:white}
.stores-table th{padding:10px 8px;text-align:center;font-weight:700;font-size:12px;white-space:nowrap}
.stores-table th.store-col{text-align:left;padding-left:14px;min-width:130px}
.stores-table td{padding:8px;border-bottom:1px solid var(--lighter);text-align:center}
.stores-table tbody tr:hover{background:var(--lighter)}
.stores-table tbody tr.has-task{font-weight:600}
.store-cell{text-align:left;padding-left:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.group-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.group-dot.A{background:var(--col-A)} .group-dot.B{background:var(--col-B)}
.group-dot.C{background:var(--col-C)} .group-dot.D{background:var(--col-D)}

.status-pill{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;display:inline-block}
.status-pill.progress{background:var(--progress);color:#666}
.status-pill.done{background:var(--done);color:white}
.status-pill.overdue{background:var(--overdue);color:white}
.status-pill.none{background:#ccc;color:#666}
.status-pill.last-done{background:#D5F5E3;color:#1E8449}
.status-pill.last-overdue{background:#FADBD8;color:#922B21}

.type-pill{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700}
.type-pill.long{background:#FDEBD0;color:#B9770E}
.type-pill.short{background:#D6EAF8;color:#2471A3}
.type-pill.none{background:#eee;color:#999}

.streak-cell{font-size:13px;font-weight:700}
.streak-cell .fire{color:#E74C3C}

.task-cell{text-align:left;font-size:12px;color:#555;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.detail-link{font-size:12px;color:var(--medium);text-decoration:none;padding:3px 8px;border:1px solid var(--light);border-radius:6px;transition:all 0.2s;white-space:nowrap}
.detail-link:hover{background:var(--lighter);border-color:var(--medium)}

/* 统计 */
.summary-row{display:flex;gap:12px;padding:12px 24px;max-width:1600px;margin:0 auto;flex-wrap:wrap}
.summary-item{background:var(--white);border-radius:8px;padding:8px 16px;box-shadow:var(--shadow);font-size:13px;display:flex;align-items:center;gap:6px}
.summary-item .si-val{font-weight:700;color:var(--primary);font-size:16px}

/* 非运营板块提示 */
.other-board-notice{text-align:center;padding:60px 20px;color:#999}
.other-board-notice .icon{font-size:48px;margin-bottom:12px}
.other-board-notice .title{font-size:18px;font-weight:700;color:#666;margin-bottom:8px}
.other-board-notice .desc{font-size:14px;color:#999}
.other-board-notice .link{margin-top:16px}
.other-board-notice .link a{display:inline-block;padding:8px 20px;background:var(--primary);color:white;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;transition:all 0.2s}
.other-board-notice .link a:hover{background:var(--dark)}

@media (max-width:768px){
  .filter-bar{padding:8px 12px}
  .top-bar{padding:0 12px}
  .nav-links{display:none}
  .search-box{width:120px}
  .table-wrap{padding:8px}
  .stores-table{min-width:600px}
  .board-tabs{padding:0 12px}
  .board-tab{padding:8px 14px;font-size:13px}
}
</style>
</head>
<body>

<div class="top-bar">
  <h1><span>🏪</span> 全门店一览 · W29</h1>
  <div class="nav-links">
    <a class="nav-link" href="/52week-board/">总看板</a>
    <a class="nav-link" href="/52week-board/current.html">本周看板</a>
    <a class="nav-link active" href="/52week-board/stores.html">全门店一览</a>
  </div>
</div>

<!-- 板块Tab栏 -->
<div class="board-tabs" id="boardTabs">
  <div class="board-tab active" data-board="ops" onclick="switchBoard('ops')">📋 运营</div>
  <div class="board-tab" data-board="training" onclick="switchBoard('training')">🎓 培训</div>
  <div class="board-tab" data-board="academy" onclick="switchBoard('academy')">📚 管理学院</div>
  <div class="board-tab" data-board="office" onclick="switchBoard('office')">🏢 总经办</div>
</div>

<!-- 运营板块内容 -->
<div id="opsContent">
  <div class="filter-bar">
    <input type="text" class="search-box" placeholder="🔍 搜索门店..." id="searchBox" oninput="render()">
    <button class="filter-btn active" onclick="filterGroup('all')">全部<span class="count">(30)</span></button>
    <button class="filter-btn" onclick="filterGroup('A')">A组<span class="count">(7)</span></button>
    <button class="filter-btn" onclick="filterGroup('B')">B组<span class="count">(9)</span></button>
    <button class="filter-btn" onclick="filterGroup('C')">C组<span class="count">(6)</span></button>
    <button class="filter-btn" onclick="filterGroup('D')">D组<span class="count">(8)</span></button>
    <span class="week-display">W29 · 7月第三周</span>
  </div>

  <div class="summary-row" id="summaryRow"></div>
  <div class="table-wrap">
    <table class="stores-table" id="storesTable"></table>
  </div>
</div>

<!-- 其他板块提示 -->
<div id="otherBoardNotice" style="display:none;">
  <div class="other-board-notice">
    <div class="icon" id="noticeIcon">🎓</div>
    <div class="title" id="noticeTitle">培训板块</div>
    <div class="desc">该板块请前往本周看板查看详细任务跟进</div>
    <div class="link"><a href="/52week-board/current.html">前往本周看板 →</a></div>
  </div>
</div>

<script>
const stores=[
  {name:"大庆新玛特",group:"A"},{name:"红博公园",group:"A"},
  {name:"西城红场",group:"A"},{name:"金安",group:"A"},
  {name:"华南万象汇",group:"A"},{name:"鞍山万象汇",group:"A"},
  {name:"沈阳三台子",group:"A"},
  {name:"哈万象汇",group:"B"},{name:"王府井",group:"B"},
  {name:"大庆让胡路",group:"B"},{name:"融创茂",group:"B"},
  {name:"佳木斯万达",group:"B"},{name:"大庆万达",group:"B"},
  {name:"沈阳万象城",group:"B"},{name:"大连甘井子",group:"B"},
  {name:"卓展",group:"B"},
  {name:"红旗茂",group:"C"},{name:"大庆百货大楼",group:"C"},
  {name:"香坊万达",group:"C"},{name:"大连凯德",group:"C"},
  {name:"沈阳盛京大奥莱",group:"C"},{name:"沈阳K11",group:"C"},
  {name:"哈东万达",group:"D"},{name:"沈阳中海环宇城",group:"D"},
  {name:"鞍山百盛",group:"D"},{name:"教化",group:"D"},
  {name:"顾乡凯德",group:"D"},{name:"长春远大",group:"D"},
  {name:"大庆乘风新玛特",group:"D"},{name:"大连凯丹",group:"D"},
];

// 本周任务
const tasks = {
  "西城红场": {board:"ops",status:"progress",type:"long",summary:"能力+服务两方面管理挑战"},
  "金安": {board:"ops",status:"progress",type:"long",summary:"转化率4.2→5.1；拓竹0开单"},
  "大连甘井子": {board:"ops",status:"progress",type:"short",summary:"全维度达成跟进，确认周环比"},
  "大连凯德": {board:"ops",status:"progress",type:"short",summary:"业绩达成周环比+短板人员"},
  "沈阳万象城": {board:"ops",status:"progress",type:"short",summary:"人货场全维度提升；拓竹破零"},
  "佳木斯万达": {board:"ops",status:"progress",type:"long",summary:"3PP+业绩+新人成长四维度"},
  "香坊万达": {board:"ops",status:"progress",type:"short",summary:"业绩低于哈东，调查复盘"},
};

// 上周达成结果（W28）
const lastWeek = {
  "西城红场": {status:"progress",result:"进行中（转化率待提升）"},
  "金安": {status:"progress",result:"转化率4.5，持续跟进"},
  "沈阳万象城": {status:"progress",result:"ACS偏低，持续跟进"},
  "佳木斯万达": {status:"done",result:"各项指标稳定达标"},
};

// 跟进周数
const streakData = {
  "西城红场":5, "金安":2, "佳木斯万达":3,
  "大连甘井子":1, "大连凯德":1, "沈阳万象城":2, "香坊万达":1,
};

const statusLabel={progress:{label:"进行中",class:"progress"},done:{label:"已完成",class:"done"},overdue:{label:"逾期",class:"overdue"},none:{label:"—",class:"none"}};
const lastStatusLabel={done:{label:"✅ 已完成",class:"last-done"},overdue:{label:"🔴 逾期",class:"last-overdue"},progress:{label:"⚡ 进行中",class:"progress"}};

let currentFilter='all';
let currentBoard='ops';

const boardConfig = {
  ops: {name:"运营板块",icon:"📋"},
  training: {name:"培训板块",icon:"🎓"},
  academy: {name:"管理学院板块",icon:"📚"},
  office: {name:"总经办板块",icon:"🏢"},
};

function switchBoard(board) {
  currentBoard = board;
  document.querySelectorAll('.board-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.board === board);
  });

  if (board === 'ops') {
    document.getElementById('opsContent').style.display = 'block';
    document.getElementById('otherBoardNotice').style.display = 'none';
  } else {
    document.getElementById('opsContent').style.display = 'none';
    document.getElementById('otherBoardNotice').style.display = 'block';
    document.getElementById('noticeIcon').textContent = boardConfig[board].icon;
    document.getElementById('noticeTitle').textContent = boardConfig[board].name;
  }
}

function render() {
  const term = document.getElementById('searchBox').value.trim();
  let filtered = stores;
  if (term) filtered = filtered.filter(s=>s.name.includes(term));
  else if (currentFilter!=='all') filtered = filtered.filter(s=>s.group===currentFilter);

  // 排序：有任务在前
  filtered.sort((a,b)=>{
    const aT=tasks[a.name]?1:0, bT=tasks[b.name]?1:0;
    return bT-aT;
  });

  let html = `<thead><tr>
    <th class="store-col">门店</th>
    <th>组别</th>
    <th>本周状态</th>
    <th>类型</th>
    <th>连续跟进</th>
    <th>本周重点</th>
    <th>上周达成</th>
    <th>操作</th>
  </tr></thead><tbody>`;

  filtered.forEach(s=>{
    const t=tasks[s.name];
    const last=lastWeek[s.name];
    const streak=streakData[s.name]||0;
    const hasTask=t?1:0;

    html+=`<tr class="${hasTask?'has-task':''}">
      <td class="store-cell"><span class="group-dot ${s.group}"></span>${s.name}</td>
      <td>${s.group}组</td>
      <td>${t?`<span class="status-pill ${statusLabel[t.status].class}">${statusLabel[t.status].label}</span>`:'<span class="status-pill none">—</span>'}</td>
      <td>${t?`<span class="type-pill ${t.type}">${t.type==='long'?'长期':'短期'}</span>`:'<span class="type-pill none">—</span>'}</td>
      <td class="streak-cell">${streak>0?`${streak>1?'<span class="fire">🔥</span>':''}${streak}周`:'—'}</td>
      <td class="task-cell">${t?t.summary:'—'}</td>
      <td class="task-cell">${last?`<span class="status-pill ${lastStatusLabel[last.status].class}">${lastStatusLabel[last.status].label}</span><br><span style="font-size:11px;color:#999;">${last.result}</span>`:'<span style="color:#ccc;">—</span>'}</td>
      <td><a class="detail-link" href="/52week-board/current.html">查看 →</a></td>
    </tr>`;
  });
  html+='</tbody>';
  document.getElementById('storesTable').innerHTML=html;

  // 汇总
  const total=filtered.length;
  const withTask=filtered.filter(s=>tasks[s.name]).length;
  const longTask=filtered.filter(s=>tasks[s.name]?.type==='long').length;
  const hasLast=filtered.filter(s=>lastWeek[s.name]).length;
  document.getElementById('summaryRow').innerHTML=`
    <div class="summary-item">🏪 门店 <span class="si-val">${total}</span></div>
    <div class="summary-item">📌 本周有任务 <span class="si-val">${withTask}</span></div>
    <div class="summary-item">🔄 长期跟进 <span class="si-val">${longTask}</span></div>
    <div class="summary-item">📊 上周有记录 <span class="si-val">${hasLast}</span></div>
  `;
}

function filterGroup(g){currentFilter=g;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));event.target.closest('.filter-btn').classList.add('active');render()}
render();
</script>
</body>
</html>
